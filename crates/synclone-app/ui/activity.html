<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recent activity</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Recent activity</h1>
  <p class="lead">The last 200 things Synclone did. Problems are marked; open one to see what happened.</p>
  <div id="list"></div>
  <div id="empty" class="empty hidden">Nothing yet.</div>
  <div id="error" class="error hidden"></div>
</main>
<script src="common.js"></script>
<script>
async function load() {
  let list = [];
  try {
    list = await rpc('activity', { limit: 200 });
  } catch (e) {
    $('error').textContent = errorText(e);
    show('error', true);
    return;
  }
  $('list').replaceChildren(
    ...list.map((a) => {
      const line = `${when(a.at)} — ${a.message}`;
      if (a.is_error) {
        const detail = [a.path ? `File: ${a.path}` : '', `What: ${a.kind}`, a.message].filter(Boolean).join('\n');
        return el('details', {}, el('summary', { class: 'error', text: line }), el('pre', { class: 'muted', text: detail }));
      }
      return el('div', { class: 'row', text: line });
    })
  );
  show('empty', list.length === 0);
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
