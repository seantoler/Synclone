name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch rclone (pinned, checksum-verified)
        shell: bash
        run: scripts/fetch-rclone
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (layers 1-2)
        # The property test runs its fixed seeds and the saved cases here, so
        # a pull request sees the same cases every time. Fresh random seeds
        # run in property-nightly.yml, which never blocks a merge (D-028).
        env:
          SYNCLONE_PROPTEST_SEED: fixed
        run: cargo test --workspace -- --nocapture
      - name: synclonectl --version
        run: cargo run -q -p synclone-cli -- --version
